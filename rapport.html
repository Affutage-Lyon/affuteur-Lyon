<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapport d'Intervention | Ken Aiguise</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
</head>
<body style="padding-top: 100px;">

    <section>
        <h2 id="client-name"></h2>
        
        <div class="menu-border">
            <div id="rapport-content">
                <p>Analyse des registres en cours...</p>
            </div>
        </div>

        <div style="margin-top: 30px; display: flex; flex-direction: column; gap: 15px; align-items: center;">
            <a id="pdf-link" href="#" target="_blank" class="btn-cta" style="display: none;">
                📄 TÉLÉCHARGER LE COMPTE-RENDU TECHNIQUE
            </a>
            
            <a href="index.html" class="btn-cta" style="border-color: var(--acier); color: var(--acier);">
                Retour à l'accueil
            </a>
        </div>
    </section>

    <script>
    document.addEventListener('DOMContentLoaded', async () => {
        // 1. Récupération de la session
        const sessionData = sessionStorage.getItem('kenAiguise_client');
        if (!sessionData) {
            window.location.href = 'index.html';
            return;
        }

        const client = JSON.parse(sessionData);
        document.getElementById('client-name').innerText = client.nom;

        try {
            // 2. Chargement des interventions depuis le dossier data
            const response = await fetch('./data/rapport.json');
            if (!response.ok) throw new Error("Fichier rapport.json introuvable");
            
            const data = await response.json();

            // 3. Filtrage des interventions pour ce client précis
            const interventions = data.interventions.filter(i => i.client_id === client.id);
            const content = document.getElementById('rapport-content');
            const pdfBtn = document.getElementById('pdf-link');

            if (interventions.length > 0) {
                // On prend la première intervention (la plus récente selon votre JSON)
                const derniere = interventions[0]; 

                // Mise à jour du contenu HTML
                content.innerHTML = `
                    <div style="text-align: left; padding: 10px;">
                        <p style="text-transform: uppercase; letter-spacing: 2px; color: var(--acier); font-size: 0.8rem; margin-bottom: 20px;">
                            Détails du Contrat : ${client.forfait}
                        </p>
                        <p><strong>Dernière intervention :</strong> ${derniere.date}</p>
                        <p><strong>Travail effectué :</strong> ${derniere.lames_affutees} lames traitées, ${derniere.baguettes_posees} baguettes posées.</p>
                        <p style="font-style: italic; color: var(--acier); margin: 20px 0; border-left: 2px solid var(--chene); padding-left: 15px;">
                            "${derniere.observations}"
                        </p>
                        <hr style="border: 0; border-top: 1px dashed rgba(194, 163, 130, 0.3); margin: 20px 0;">
                        <p style="color: var(--chene); font-weight: bold; letter-spacing: 1px;">
                            PROCHAIN PASSAGE PRÉVU : ${derniere.prochain_passage}
                        </p>
                    </div>
                `;

                // 4. Gestion dynamique du bouton PDF
                if (derniere.lien_pdf) {
                    pdfBtn.href = derniere.lien_pdf;
                    pdfBtn.style.display = 'inline-flex';
                }
            } else {
                content.innerHTML = "<p>Aucune intervention enregistrée pour le moment.</p>";
            }
        } catch (error) {
            console.error("Erreur technique :", error);
            document.getElementById('rapport-content').innerHTML = "<p>Erreur lors de la récupération des données techniques.</p>";
        }
    });
    </script>
</body>
</html>
